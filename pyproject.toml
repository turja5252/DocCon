[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "elite-doccon"
version = "1.74"
description = "Elite DocCon Suite — transmittal workstation (slice 1: Jira register pull)"
requires-python = ">=3.11"
authors = [{ name = "Tanzim Nasir" }]
license = { text = "LicenseRef-Proprietary" }
dependencies = [
    "keyring>=25,<26",
    "openpyxl>=3.1,<4",
    "pypdf>=5,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.12"]
pack = ["pyinstaller>=6,<7"]

[project.scripts]
doccon = "doccon.gui:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
